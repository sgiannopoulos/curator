<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Assist · Workspace prototype</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243349;background:#e8ecf1;font-size:14px;--line:#dce1e8;--blue:#215bc4;--muted:#627084}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:6px;background:white;padding:7px 11px;line-height:1.3}button:hover:not(:disabled){background:#edf3fe}button:disabled,select:disabled,textarea:disabled{opacity:.48;cursor:default}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.danger{color:#a32836}button.ghost{background:transparent;border-color:transparent}button.selected{background:#e7efff;border-color:#abc2ed;color:#174b9d}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #719fe8;outline-offset:2px}h1,h2,h3,p{margin-top:0}h1{font-size:21px;letter-spacing:-.5px;margin-bottom:5px}h2{font-size:17px;margin-bottom:12px}h3{font-size:14px}p{line-height:1.6}small,.muted{color:var(--muted);font-size:12px;line-height:1.5}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:12px}.grow{flex:1;min-width:0}.pill{font-size:11px;padding:3px 7px;border-radius:5px;background:#e9f4ee;color:#246347;white-space:nowrap}.pill.outdated,.pill.stale{background:#fbf1d9;color:#805c12}.pill.unavailable{background:#fbe9eb;color:#a32836}code,pre{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef1f6;padding:12px;border-radius:5px;line-height:1.65}input,textarea,select{border:1px solid #c8d0dc;border-radius:6px;background:white;padding:8px}textarea{resize:vertical;min-height:84px;line-height:1.65;width:100%}label{display:grid;gap:6px}a{color:var(--blue)}.prototype-top{background:#243349;color:#fff;padding:8px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;font-size:12px}.prototype-top select,.prototype-top button{color:#243349;padding:3px 8px;font-size:12px}.window{margin:20px auto 100px;max-width:1550px;height:calc(100vh - 170px);min-height:660px;display:flex;overflow:hidden;border:1px solid #c9d1dd;border-radius:12px;box-shadow:0 12px 40px #24334912;background:white}.rail{width:190px;flex:none;background:#edf0f5;padding:19px 12px;display:flex;flex-direction:column;border-right:1px solid var(--line);gap:17px}.rail button{text-align:left}.brand{font-size:16px;font-weight:650;padding:0 9px}.rail-foot{margin-top:auto;padding:0 9px}.content{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{padding:20px 23px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;justify-content:space-between}.banner{padding:12px 22px;background:#fff7e5;border-bottom:1px solid #edddba;display:flex;align-items:center;gap:14px;font-size:12px}.activity{padding:10px 22px;background:#f2f6fc;border-bottom:1px solid var(--line);font-size:12px}.body{flex:1;min-height:0;display:flex}.catalog{width:265px;flex:none;overflow:auto;border-right:1px solid var(--line);background:#fafbfd}.catalog-head{padding:17px 14px;display:grid;gap:12px}.tabs{display:flex;gap:5px}.tabs button{font-size:12px;padding:5px 8px}.flow-row{width:100%;border:0;border-top:1px solid #e4e8ef;border-radius:0;text-align:left;background:transparent;padding:16px 15px;display:grid;gap:8px}.flow-row strong{font-size:13px;line-height:1.4}.flow-row.active{background:#e7efff;box-shadow:inset 3px 0 var(--blue)}.detail{flex:1;min-width:240px;overflow:auto;padding:25px 26px}.detail h2{font-size:23px;line-height:1.25;letter-spacing:-.5px;margin:20px 0}.description{white-space:pre-wrap;max-width:70ch;line-height:1.85}.evidence{border-top:1px solid var(--line);margin-top:28px;padding-top:18px}.citation{width:100%;text-align:left;margin:8px 0;padding:12px;display:grid;gap:9px}.chat{min-height:0;width:350px;min-width:260px;display:flex;flex-direction:column;background:#f8fafc;border-left:1px solid var(--line)}.pane-title{padding:18px;border-bottom:1px solid var(--line)}.messages{padding:18px;overflow:auto;flex:1}.message{margin-bottom:21px}.message .who{font-size:12px;font-weight:650;margin-bottom:7px}.message.user{background:#e8eef9;padding:13px;border-radius:8px}.message p{font-size:13px;margin-bottom:0}.event{padding:9px 10px;border-left:2px solid #6b94ce;background:#eef3fb;font-size:12px;margin:12px 0;line-height:1.5}details{font-size:12px;margin:12px 0}summary{cursor:pointer;line-height:1.7;color:#51657e}.composer{padding:14px;border-top:1px solid var(--line);background:white}.composer textarea{font-size:13px;min-height:75px}.composer .row{margin-top:9px}.history{flex:1;overflow:auto;padding:24px}.history-row{padding:18px 0;border-bottom:1px solid var(--line)}.variant-B .chat{width:auto;flex:1;border-left:0;border-right:1px solid var(--line)}.variant-B .messages{padding:24px 35px}.variant-B .body{display:grid;grid-template-columns:minmax(350px,1fr) 390px}.variant-B .review-side{display:flex;flex-direction:column;min-height:0}.variant-B .catalog{width:auto;max-height:220px;border:0;border-bottom:1px solid var(--line)}.variant-B .catalog-head{padding:12px 18px}.variant-B .flow-row{padding:10px 18px}.variant-B .detail{padding:18px 24px}.variant-B .detail h2{font-size:20px;margin:10px 0}.variant-C .rail{width:185px}.variant-C .chat{flex:1;border:0;max-width:880px;margin:auto;height:100%;width:100%}.variant-C .catalog{width:330px}.variant-C .detail{padding:35px 45px}.navtabs{display:flex;gap:8px;padding:11px 22px;border-bottom:1px solid var(--line)}.navtabs button{border-color:transparent}.switcher{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:#243349;color:white;padding:8px;border-radius:13px;box-shadow:0 4px 25px #24334930;z-index:3}.switcher button{background:#374962;border-color:#506077;color:white}.switcher span{min-width:200px;text-align:center;font-size:13px}.switcher button.selected{background:white;color:#243349}.empty{padding:40px;max-width:600px;margin:auto}.empty h2{font-size:26px}.workspace-card{padding:18px;border:1px solid var(--line);border-radius:8px;margin:16px 0}.state{font-size:11px;max-width:1550px;margin:-86px auto 76px;padding:0 14px;color:var(--muted)}dialog{border:1px solid #c8d0dc;border-radius:12px;max-width:620px;width:calc(100% - 40px);padding:27px;color:#243349;box-shadow:0 20px 80px #24334940}dialog::backdrop{background:#17293f66}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.danger-note{background:#fff3e3;padding:12px;font-size:12px}.source-line{background:#e1ebfe;display:block}.text-only{white-space:pre-wrap}.notice{font-size:12px;padding:10px 22px;background:#edf5ef}.prose{max-width:72ch}.overflow{overflow-wrap:anywhere}@media(max-width:1150px){.window{margin:10px 10px 100px}.rail{width:150px}.catalog{width:220px}.chat{width:300px}.detail{padding:20px}.topbar{padding:16px}.variant-B .body{grid-template-columns:minmax(300px,1fr) 340px}.variant-C .catalog{width:260px}}@media(max-width:850px){.window{height:auto;min-height:calc(100vh - 160px)}.rail{width:130px}.body,.variant-B .body{display:flex;flex-wrap:wrap;overflow:visible}.content{min-width:0}.catalog,.variant-C .catalog{width:100%;max-height:230px}.chat,.variant-B .chat{width:100%;min-height:440px;flex:auto}.detail{min-width:0;width:100%;flex:auto}.variant-B .review-side{width:100%}.topbar{flex-wrap:wrap}.prototype-top{flex-wrap:wrap}.topbar .row{flex-wrap:wrap}.switcher span{min-width:130px}.switcher{gap:4px}.state{margin-left:12px}.banner{flex-wrap:wrap}.variant-C .detail{padding:22px}}@media(max-width:650px){.topbar .grow{flex-basis:100%}}@media(max-width:550px){.rail{display:none}.switcher button{padding:7px}.switcher span{min-width:115px;font-size:11px}.window{margin-left:5px;margin-right:5px}.prototype-top{padding:8px}.detail h2{font-size:21px}.topbar h1{font-size:19px}}
</style>
<div class="prototype-top"><span>Throwaway prototype · fictional data · changes reset on reload</span><div class="row"><label>Scenario <select id="scenario"><option value="ready">Ready to review</option><option value="empty">Empty Workspace</option><option value="missing">Repository unavailable</option><option value="config">Configuration missing</option><option value="failed">Failed Scan</option><option value="interrupted">Interrupted Scan</option><option value="storage">Storage error</option></select></label><button onclick="reset()">Reset demo</button></div></div>
<main id="app"></main><div id="state" class="state"></div><nav class="switcher" aria-label="Prototype layout"><button onclick="cycle(-1)" aria-label="Previous layout">←</button><span id="variant-label"></span><button onclick="cycle(1)" aria-label="Next layout">→</button><button data-variant="A" onclick="setVariant('A')">A</button><button data-variant="B" onclick="setVariant('B')">B</button><button data-variant="C" onclick="setVariant('C')">C</button></nav><dialog id="modal"></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={A:'Catalog first',B:'Conversation first',C:'Focused tabs'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let repositoryPath='~/Source/acorn-web';
let flows,selected,filter,query,view,busy,stopping,phase,scenario,events,messages,records,notice,effort,draft='',home=false,deletedWorkspace=false;
const initialFlows=()=>[
{id:1,title:'Create an account with email',status:'Active',desc:'A visitor opens the sign-up page and enters their name, email address, and a password.\n\nWhen all fields are valid and the email is unused, the account is created and a verification email is sent. The visitor is asked to check their inbox before continuing.',citations:[['src/auth/signup.ts',42,68,'Validates registration input and sends the verification email.','Current']],origin:'Scan'},
{id:2,title:'Recover access with a reset link',status:'Active',desc:'A user who cannot sign in requests a password reset using their email address.\n\nThey receive a time-limited link. After choosing a valid new password, they can sign in again. An expired link offers a new reset request.',citations:[['src/auth/reset.ts',28,54,'Checks expiry before accepting a replacement password.','Stale']],origin:'Scan'},
{id:3,title:'Invite a teammate to the Workspace',status:'Active',desc:'An administrator opens the members page, enters a teammate’s email address, and sends an invitation.\n\nThe invited person follows the email link and joins with the role chosen by the administrator.',citations:[['src/members/invite.ts',17,43,'Requires administrator permission and records the invited role.','Current']],origin:'Scan'},
{id:4,title:'Sign in with a magic link',status:'Outdated',desc:'A returning user requests a one-time email link and opens it to sign in without a password.',citations:[['src/auth/routes.ts',12,24,'The magic-link entry point has been removed; email/password sign-in remains.','Current']],origin:'Scan'}];
function reset(){repositoryPath='~/Source/acorn-web';flows=initialFlows();selected=1;filter='All';query='';view='flows';busy=false;stopping=false;phase=0;scenario='ready';events=[];messages=[];notice='';effort='Standard';records=[{name:'Today, 10:42',outcome:'Completed',effort:'Standard',result:'4 User Flows added',usage:'18,420 tokens · $0.014',events:[]}];home=false;deletedWorkspace=false;draft='';$('#scenario').value='ready';render()}
const locked=()=>busy, agentDisabled=()=>busy||['missing','config'].includes(scenario);
function setVariant(v){variant=v;const u=new URL(location);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}
function cycle(n){setVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3])}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable],dialog'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
function rail(){return `<aside class="rail"><div class="brand">QA Assist</div><button class="ghost" onclick="home=true;render()">Workspaces</button>${!deletedWorkspace?`<button class="selected" onclick="home=false;render()">▣ &nbsp; acorn-web<br><small>${flows.length} User Flows</small></button>`:''}<div class="rail-foot"><small>Workspace data stays outside your Repository.</small><details><summary>About stored data</summary><small>Full Agent Chat is retained locally and may contain source content or secrets. App storage is not encrypted by QA Assist.</small></details><button class="ghost danger" ${busy?'disabled':''} onclick="deleteWorkspace()">Delete Workspace</button></div></aside>`}
function header(){return `<header class="topbar"><div class="grow"><h1>acorn-web</h1><div class="muted overflow">${esc(repositoryPath)}</div></div><div class="row"><label class="muted">Scanning Effort<select aria-label="Scanning Effort" ${agentDisabled()?'disabled':''} onchange="effort=this.value"><option ${effort==='Quick'?'selected':''}>Quick</option><option ${effort==='Standard'?'selected':''}>Standard</option><option ${effort==='Maximum'?'selected':''}>Maximum</option></select></label><button class="primary" ${agentDisabled()?'disabled':''} onclick="startScan()">Start Scan</button>${variant!=='C'?`<button onclick="view=view==='history'?'flows':'history';render()">${view==='history'?'Back to review':'Scan history'}</button>`:''}</div></header>`}
function banners(){return (scenario==='missing'?`<div class="banner"><div class="grow"><strong>Repository unavailable</strong><br>Saved User Flows and history are available. You can still edit manually.</div><button onclick="relink()">Relink Repository</button></div>`:scenario==='config'?`<div class="banner"><strong>Agent unavailable</strong><span>Add OPENROUTER_API_KEY and OPENROUTER_MODEL to the application root .env, then restart QA Assist. Saved data remains available.</span></div>`:'')+(notice?`<div class="notice" role="status">${esc(notice)}</div>`:'')+`<div class="activity row between"><span>${busy?`<strong>${stopping?'Stopping…':phase===0?'Review Pass':phase!==2?'Discovery Pass':'Agent working'}</strong> · ${phase===0?'Reviewing existing Active and Outdated User Flows':phase!==2?'Looking for additional behavior':'Responding in Agent Chat'}${stopping?' · Waiting for agent execution to end':''}`:'Agent idle · Quick, Standard, and Maximum request different detail; none promises complete coverage.'}</span>${busy?`<button ${stopping?'disabled':''} onclick="stop()">${stopping?'Stopping…':'Stop'}</button>`:''}</div>`}
function catalog(){let list=flows.filter(f=>(filter==='All'||f.status===filter)&&f.title.toLowerCase().includes(query.toLowerCase()));return `<section class="catalog"><div class="catalog-head"><div class="row between"><strong>User Flows <span class="muted">${flows.length}</span></strong><button ${locked()?'disabled':''} onclick="editFlow(true)">+ Add</button></div><input aria-label="Search User Flows" placeholder="Find a User Flow" value="${esc(query)}" oninput="searchFlows(this)"><div class="tabs">${['All','Active','Outdated'].map(t=>`<button class="${filter===t?'selected':''}" onclick="filter='${t}';render()">${t} ${t==='All'?flows.length:flows.filter(f=>f.status===t).length}</button>`).join('')}</div></div>${list.length?list.map(f=>`<button class="flow-row ${selected===f.id?'active':''}" onclick="selected=${f.id};render()"><strong>${esc(f.title)}</strong><div class="row between"><span class="pill ${f.status.toLowerCase()}">${f.status}</span><small>${f.citations.length} source citation${f.citations.length===1?'':'s'}</small></div></button>`).join(''):'<p class="muted" style="padding:18px">No User Flows here. Add one manually or start a Scan.</p>'}</section>`}
function searchFlows(input){const pos=input.selectionStart;query=input.value;render();const next=$('[aria-label="Search User Flows"]');next.focus();next.setSelectionRange(pos,pos)}
function detail(){const f=flows.find(f=>f.id===selected);if(!f)return `<section class="detail empty"><h2>Understand what people can do.</h2><p>Select a User Flow, add one manually, or start a Scan to infer behavior from this Repository.</p><button ${locked()?'disabled':''} onclick="editFlow(true)">Add User Flow</button></section>`;return `<article class="detail"><div class="row between wrap"><span class="pill ${f.status.toLowerCase()}">${f.status}</span><div class="row"><button ${locked()?'disabled':''} onclick="editFlow(false)">Edit</button><button class="danger" ${locked()?'disabled':''} onclick="removeFlow()">Delete</button></div></div><h2>${esc(f.title)}</h2><p class="description">${esc(f.desc)}</p>${f.status==='Outdated'?`<div class="banner" style="padding:12px"><div class="grow">Source evidence indicates this behavior is no longer current.</div><button ${locked()?'disabled':''} onclick="reactivate()">Mark Active</button></div>`:''}<div class="evidence"><h3>Source Citations</h3><p class="muted">Evidence for the agent’s judgment. Manual edits retain these citations and do not establish a new source review.</p>${f.citations.map((c,i)=>`<button class="citation" onclick="citation(${i})"><div class="row between wrap"><code>${esc(c[0])}:${c[1]}–${c[2]}</code><span class="pill ${(scenario==='missing'?'Unavailable':c[4]).toLowerCase()}">${scenario==='missing'?'Unavailable':c[4]}</span></div><span class="muted">${esc(c[3])}</span></button>`).join('')||'<p class="muted">Added manually. No Source Citations.</p>'}${f.citations.some(c=>c[4]==='Stale')?'<p class="muted">Stale means the file has changed. It does not change this User Flow’s status.</p>':''}</div><p class="muted" style="margin-top:24px">Latest change: ${esc(f.origin)} · No revision history</p></article>`}
function chat(){return `<section class="chat"><div class="pane-title"><strong>Agent Chat</strong><div class="muted">One ongoing conversation for this Workspace</div></div><div class="messages">${scenario!=='empty'?`<div class="message user"><div class="who">You</div><p>Scan this Repository with Standard effort.</p></div><div class="event">Scan completed · 4 User Flows added</div><div class="message"><div class="who">Agent</div><p>I found registration, account recovery, and team invitations. The magic-link flow is Outdated because its route has been removed.</p><details><summary>Tool activity · full input and output</summary><pre>read_file({"path":"src/auth/routes.ts"})\n12: router.post('/signup', signup)\n13: router.post('/signin', passwordSignIn)\n14: // magic-link route removed</pre></details><details><summary>Provider-returned reasoning</summary><p>Illustrative provider block: inspect the public routes before reviewing the authentication flows.</p></details><details><summary>Files considered, read, and excluded</summary><pre>Considered: 184 files\nRead: src/auth/routes.ts, src/auth/signup.ts, src/auth/reset.ts, src/members/invite.ts\nExcluded: node_modules/ — dependencies\nUnfinished: billing integration not inspected</pre></details><div class="muted">Final usage: 18,420 tokens · $0.014</div></div>`:'<p class="muted">Start a Scan, ask a question, or describe a change to User Flows.</p>'}${messages.map(m=>`<div class="message ${m.role==='You'?'user':''}"><div class="who">${m.role}</div><p class="text-only">${esc(m.text)}</p></div>`).join('')}${events.map(e=>`<div class="event">${esc(e)}</div>`).join('')}</div><div class="composer"><textarea aria-label="Message Agent Chat" placeholder="Ask a question or describe a change to User Flows…" ${agentDisabled()?'disabled':''} oninput="draft=this.value">${esc(draft)}</textarea><div class="row between"><small>${busy?'Read-only while the agent works. Stop to continue.':scenario==='missing'?'Relink the Repository to use Agent Chat.':scenario==='config'?'Fix application configuration to continue.':'Questions explain. Change requests apply directly.'}</small><button class="primary" ${agentDisabled()?'disabled':''} onclick="send()">Send</button></div></div></section>`}
function scanHistory(){return `<section class="history"><h2>Scan history</h2><p class="muted">Past attempts and committed results. Historical mentions cannot restore deleted User Flows.</p>${records.map((r,i)=>`<div class="history-row"><div class="row between"><strong>${esc(r.name)}</strong><span class="pill ${r.outcome==='Completed'?'':'stale'}">${r.outcome}</span></div><p>${esc(r.effort)} effort · ${esc(r.result)}</p><p class="muted">Final usage: ${esc(r.usage)}</p><button onclick="view='chat';render()">Open Agent Chat</button><details><summary>Scan Record</summary><p>Model: deepseek/deepseek-v4-flash-0731</p><pre>${esc(r.events.join('\n')||'Review Pass: no existing flows\nDiscovery Pass: 4 committed results\nUnfinished: billing integration not inspected')}</pre></details></div>`).join('')}</section>`}
function workspaces(){return `<div class="empty"><h2>Your Workspaces</h2><p>Open a local Repository to inspect and curate its User Flows.</p>${!deletedWorkspace?`<div class="workspace-card"><h3>acorn-web</h3><p class="muted">~/Source/acorn-web<br>${flows.length} User Flows · ${records.length} Scan Records</p><button class="primary" onclick="home=false;render()">Open Workspace</button></div>`:''}<button onclick="openRepository()">Choose Repository…</button><p class="muted" style="margin-top:18px">Choosing a recognized Repository opens its existing Workspace.</p></div>`}
function render(){let body;if(scenario==='storage'){body='<div class="empty"><h2>Workspace storage could not be opened</h2><p>The saved schema is unsupported. Your data has not been changed.</p><pre>~/Library/Application Support/QA Assist/</pre><p>Use a compatible application version to open this data. The MVP has no storage-recovery interface.</p></div>'}else if(home||deletedWorkspace){body=workspaces()}else{let inner=view==='history'?scanHistory():variant==='C'&&view==='chat'?chat():variant==='B'?`<div class="review-side">${catalog()}${detail()}</div>`:`${catalog()}${detail()}`;if(variant==='B'&&view!=='history')inner=chat()+inner;if(variant==='A')inner+=chat();body=`<section class="content">${header()}${banners()}${variant==='C'?`<nav class="navtabs">${[['flows','User Flows'],['chat','Agent Chat'],['history','Scan history']].map(([v,t])=>`<button class="${view===v?'selected':''}" onclick="view='${v}';render()">${t}</button>`).join('')}</nav>`:''}<div class="body">${inner}</div></section>`}$('#app').innerHTML=`<div class="window variant-${variant}">${rail()}${body}</div>`;$('#variant-label').textContent=`${variant} · ${names[variant]}`;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('selected',b.dataset.variant===variant));$('#state').textContent=`Demo state: ${scenario} | view: ${view} | execution: ${stopping?'stop requested':busy?'running':'idle'} | selected: ${selected??'none'} | catalog: ${flows.map(f=>f.id+':'+f.status).join(', ')||'empty'} | mutations: ${locked()?'disabled':'enabled'} | saved data: memory only`}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function editFlow(add){const f=add?{title:'',desc:''}:flows.find(f=>f.id===selected);modal(`<h2>${add?'Add User Flow':'Edit User Flow'}</h2><form onsubmit="saveFlow(event,${add})"><div class="stack"><label>Title<input id="title" required value="${esc(f.title)}"></label><label>Description<textarea id="description" required style="min-height:220px">${esc(f.desc)}</textarea></label><small>Save keeps the current status and citations. It does not request an agent review.</small></div><div class="actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save</button></div></form>`)}
function saveFlow(e,add){e.preventDefault();const values={title:$('#title').value,desc:$('#description').value,origin:'Manual'};if(add){selected=Date.now();flows.push({id:selected,status:'Active',citations:[],...values})}else Object.assign(flows.find(f=>f.id===selected),values);closeModal();notice='User Flow saved. Current citations and status are unchanged.';render()}
function removeFlow(){const f=flows.find(f=>f.id===selected);modal(`<h2>Delete “${esc(f.title)}”?</h2><p>This permanently removes this User Flow and its current citations. There is no undo.</p><p class="danger-note">Historical mentions remain in Agent Chat and Scan Records. They cannot restore this flow. A later Scan may rediscover its behavior as a new User Flow.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmRemove()">Delete permanently</button></div>`)}
function confirmRemove(){flows=flows.filter(f=>f.id!==selected);selected=flows[0]?.id;closeModal();notice='User Flow permanently deleted. Historical mentions remain.';render()}
function reactivate(){const f=flows.find(f=>f.id===selected);f.status='Active';f.origin='Manual';notice='Marked Active. Citations are unchanged.';render()}
function citation(i){const c=flows.find(f=>f.id===selected).citations[i],missing=scenario==='missing';modal(`<div class="row between"><h2>Source Citation</h2><button onclick="closeModal()" aria-label="Close source">×</button></div><code>${esc(c[0])}:${c[1]}–${c[2]}</code><p style="margin-top:16px">${esc(c[3])}</p>${missing?'<p class="danger-note">Source unavailable. Relink the Repository to inspect this location. The citation is retained.</p>':`<p class="muted">${c[4]==='Stale'?'This file has changed since the citation was accepted. The recorded lines may no longer support this judgment.':'Source preview at the recorded location.'}</p><pre>${c[1]-1}  // Fictional source preview for this prototype\n<span class="source-line">${c[1]}  if (!isValid(request)) return validationError();\n${c[1]+1}  await performRequestedAction(request);</span>${c[1]+2}  return success();</pre>`}`)}
function startScan(){if(agentDisabled())return;busy=true;stopping=false;phase=0;notice='';events.push(`Scan started · ${effort} effort. Reviewing ${flows.length} existing User Flows.`);view='chat';render()}
function demoControls(){if(busy&&!stopping)$('#state').innerHTML+=` <button onclick="advance()">Simulate next agent event</button> <button onclick="finish('Failed')">Simulate provider failure</button>`}
const baseRender=render;render=function(){baseRender();if(busy)demoControls()};
function advance(){if(!busy||stopping)return;if(phase===3){finish('Completed');return}if(phase===2){messages.push({role:'Agent',text:'Demo response: the current catalog and source evidence are available for review. This prototype does not interpret requests or execute an agent.'});finish('Completed');return}if(phase===0){phase=1;events.push(`Review Pass finished · ${flows.length} reviewed. Discovery Pass started. Indeterminate evidence leaves existing flows unchanged.`)}else{if(!flows.some(f=>f.title==='Reject an expired invitation')){const f={id:Date.now(),title:'Reject an expired invitation',status:'Active',desc:'A recipient opens an expired team invitation. The application explains that the link has expired and asks them to request another invitation from an administrator.',citations:[['src/members/invite.ts',62,74,'Rejects expired tokens before adding a member.','Current']],origin:'Scan'};flows.push(f);events.push('User Flow added: Reject an expired invitation. The result is committed and remains after stopping.')}phase=3;}render()}
function stop(){stopping=true;render();setTimeout(()=>{if(busy&&stopping)finish('Cancelled')},900)}
function finish(outcome){if(!busy)return;const wasChat=phase===2;busy=false;stopping=false;const error=outcome==='Failed'?'OpenRouter request failed: 401 Unauthorized. Correct OPENROUTER_API_KEY in the application root .env, restart QA Assist, and begin a new task.':outcome==='Cancelled'?'Stopped by you. Committed changes remain.':'Execution completed. Committed changes remain.';events.push(error);notice=error;if(!wasChat)records.unshift({name:'Just now',outcome,effort,result:'See committed results in Agent Chat',usage:outcome==='Completed'?'21,104 tokens · $0.017':'Unavailable',events:[...events]});render()}
function send(){if(agentDisabled()||!draft.trim())return;messages.push({role:'You',text:draft});draft='';busy=true;phase=2;notice='';events.push('Agent request started. Additional messages and manual catalog changes are disabled until it ends.');render()}
function relink(){modal(`<h2>Relink Repository</h2><p>Choose another location for the same Repository. User Flows and history will be retained.</p><label>Simulated directory selection<input id="relink-path" value="~/Development/acorn-web"></label><label style="display:flex;margin-top:18px"><input type="checkbox" id="same-repo"> I confirm this is the same Repository.</label><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmRelink()">Relink Repository</button></div>`)}
function confirmRelink(){if(!$('#same-repo').checked){$('#same-repo').focus();return}const path=$('#relink-path').value;scenario='ready';$('#scenario').value='ready';repositoryPath=path;notice=`Repository relinked to ${path}. Catalog and history retained. Directory selection is simulated.`;closeModal();render()}
function openRepository(){modal(`<h2>Choose Repository</h2><p>This prototype simulates the macOS directory picker.</p><button onclick="deletedWorkspace=false;home=false;closeModal();notice='Recognized Repository: opened its existing Workspace.';render()">Choose ~/Source/acorn-web</button><div class="actions"><button onclick="closeModal()">Cancel</button></div>`)}
function deleteWorkspace(){modal(`<h2>Delete this Workspace?</h2><p>Permanently delete its User Flows, Scan history, Agent Chat, and application-owned working data. Your Repository and application configuration remain untouched.</p><p>There is no undo or automatic restoration.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="flows=[];records=[];messages=[];events=[];deletedWorkspace=true;home=true;closeModal();render()">Delete Workspace permanently</button></div>`)}
$('#scenario').addEventListener('change',e=>{const next=e.target.value;reset();scenario=next;$('#scenario').value=next;if(next==='empty'){flows=[];selected=null;records=[];messages=[];events=[]}if(next==='failed'||next==='interrupted'){const outcome=next==='failed'?'Failed':'Interrupted';notice=next==='failed'?'OpenRouter returned 429: rate limit exceeded. The request ended. Begin a new task after the provider allows requests.':'The application exited during this Scan. Committed results remain. Start a new Scan to continue; this attempt cannot resume.';events.push(notice);records.unshift({name:'Just now',outcome,effort:'Maximum',result:'2 committed results retained',usage:'Unavailable',events:[notice]})}render()});
reset();
</script></html>
